<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RhapsInc. | Stock Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.add(theme);
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; padding-top: 70px; }
        .light body { background-color: #fbfbfd; color: #1d1d1f; }
        .dark body { background-color: #000000; color: #ffffff; }
        .apple-nav { position: fixed; top: 0; left: 0; right: 0; min-height: 50px; backdrop-filter: saturate(180%) blur(20px); z-index: 1000; display: flex; align-items: center; border-bottom: 1px solid rgba(128,128,128,0.1); padding: 0 16px; }
        .light .apple-nav { background: rgba(255, 255, 255, 0.8); }
        .dark .apple-nav { background: rgba(0, 0, 0, 0.8); }
        .apple-card { border-radius: 24px; transition: all 0.3s ease; overflow: hidden; height: 100%; border: 1px solid rgba(128,128,128,0.1); }
        .light .apple-card { background: #ffffff; }
        .dark .apple-card { background: #1c1c1e; }
        .pill-btn { font-size: 10px; font-weight: 800; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
        .pill-btn.active { background: #0071e3; color: white; }
    </style>
</head>
<body class="px-4 md:px-6 pb-12">
    <nav class="apple-nav">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center px-4">
            <span class="text-xs font-black tracking-tighter text-blue-500">RHAPSINC.</span>
            <div class="flex gap-6 md:gap-10">
                <a href="index.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Home</a>
                <a href="explorer.html" class="text-[10px] font-bold uppercase text-blue-500">Explorer</a>
                <a href="networth.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Projector</a>
                <a href="ledger.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Dividends</a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex bg-gray-500/10 p-1 rounded-lg">
                    <span id="curGBP" onclick="setCurrency('GBP')" class="pill-btn">£</span>
                    <span id="curUSD" onclick="setCurrency('USD')" class="pill-btn active">$</span>
                </div>
                <button onclick="toggleTheme()" class="text-lg hover:scale-110 transition">🌓</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto space-y-4 pt-6 w-full">
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight">Market Intelligence.</h1>
                <p class="text-gray-500 font-medium text-sm">Polygon-Native Terminal — Sunday Protocol Active</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="stockInput" onkeydown="if(event.key==='Enter') searchStock()" placeholder="AAPL..." class="rounded-xl px-4 py-3 w-48 font-bold uppercase border-none bg-gray-100 dark:bg-zinc-800 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <button onclick="searchStock()" class="bg-blue-600 text-white font-bold px-8 py-3 rounded-xl hover:bg-blue-500 transition-all text-sm">Execute</button>
            </div>
        </header>

        <div id="resultsArea" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-stretch">
            <div class="col-span-full apple-card p-24 text-center opacity-30 border-dashed border-2">
                <p class="text-xs font-bold uppercase tracking-widest">Awaiting Command...</p>
            </div>
        </div>
    </main>

    <script>
        const POLYGON_KEY = '7iaJfBVWhlolhWIiit6qnC8_Vd_K2YEX';
        const FINNHUB_KEY = 'd6d2ishr01qgk7mkb5c0d6d2ishr01qgk7mkb5cg';
        let priceChart, currentCurrency = 'USD', exchangeRate = 1, lastStockData = null;

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
            html.classList.remove('dark', 'light');
            html.classList.add(newTheme);
            if (lastStockData) renderUI(lastStockData);
        }

        async function setCurrency(ccy) {
            currentCurrency = ccy;
            document.getElementById('curUSD').classList.toggle('active', ccy === 'USD');
            document.getElementById('curGBP').classList.toggle('active', ccy === 'GBP');
            if (ccy === 'GBP') {
                const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=FX:USDGBP&token=${FINNHUB_KEY}`);
                const data = await res.json();
                exchangeRate = data.c || 0.79;
            } else { exchangeRate = 1; }
            if (lastStockData) renderUI(lastStockData);
        }

        const convert = (val) => {
            const sym = currentCurrency === 'USD' ? '$' : '£';
            return `${sym}${(val * exchangeRate).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        };

        async function searchStock() {
            const ticker = document.getElementById('stockInput').value.toUpperCase();
            if(!ticker) return;
            
            document.getElementById('resultsArea').innerHTML = `<div class="col-span-full p-24 text-center text-blue-500 font-black text-xs animate-pulse tracking-widest">INITIALIZING POLYGON STREAM...</div>`;
            
            try {
                // Polygon for historical graph (1-month daily)
                // Finnhub for real-time quote and metrics (Dividends)
                const [q, p, m, cData] = await Promise.all([
                    fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`).then(r => r.json()),
                    fetch(`https://finnhub.io/api/v1/stock/profile2?symbol=${ticker}&token=${FINNHUB_KEY}`).then(r => r.json()),
                    fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${FINNHUB_KEY}`).then(r => r.json()),
                    fetch(`https://api.polygon.io/v2/aggs/ticker/${ticker}/range/1/day/2026-01-20/2026-02-22?adjusted=true&sort=asc&apiKey=${POLYGON_KEY}`).then(r => r.json())
                ]);

                if (!q.c) throw new Error("Invalid Ticker");

                lastStockData = { ticker, q, p, m, results: cData.results };
                renderUI(lastStockData);
            } catch (e) {
                document.getElementById('resultsArea').innerHTML = `<div class="col-span-full p-16 text-center text-red-500 font-bold uppercase text-xs">Request Denied. Check Ticker or Key Limits.</div>`;
            }
        }

        function renderUI(data) {
            const { ticker, q, p, m, results } = data;
            const met = m.metric || {};
            const divYield = met.dividendYieldIndicatedAnnual || met.dividendYieldIndicatedAnnualYoy || 0;

            document.getElementById('resultsArea').innerHTML = `
                <div class="col-span-full apple-card p-8 flex items-center justify-between">
                    <div class="flex items-center gap-6">
                        <img src="${p.logo}" class="w-14 h-14 rounded-2xl bg-white p-1" onerror="this.style.display='none'">
                        <div>
                            <h2 class="text-4xl font-black tracking-tighter leading-none">${p.name || ticker}</h2>
                            <p class="text-blue-500 font-bold uppercase text-[10px] mt-2 tracking-widest">${p.finnhubIndustry || 'Equity Asset'}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-4xl font-black">${convert(q.c)}</div>
                        <div class="${q.dp >= 0 ? 'text-emerald-500' : 'text-red-500'} text-sm font-bold">
                            ${q.dp >= 0 ? '▲' : '▼'} ${Math.abs(q.dp || 0).toFixed(2)}%
                        </div>
                    </div>
                </div>

                <div class="md:col-span-2 lg:col-span-3 apple-card p-8">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6">Historical Trend (Polygon API)</h3>
                    <div class="h-[300px] w-full"><canvas id="stockChart"></canvas></div>
                </div>

                <div class="apple-card p-8 bg-blue-600 text-white flex flex-col justify-center">
                    <h3 class="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-2">Dividend Yield</h3>
                    <div class="text-5xl font-black">${divYield > 0 ? divYield.toFixed(2) : '0.00'}%</div>
                    <p class="text-[11px] opacity-80 mt-1 font-bold uppercase">${met.dividendPerShareAnnual ? convert(met.dividendPerShareAnnual) : 'N/A'} / Share</p>
                </div>

                <div class="apple-card p-8 space-y-6">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Valuation</h3>
                    <div><div class="text-2xl font-black">${p.marketCapitalization ? (p.marketCapitalization / 1000).toFixed(2) : 'N/A'}B</div><div class="text-[9px] font-bold text-gray-500 uppercase">Market Cap</div></div>
                    <div><div class="text-2xl font-black">${met.peBasicExclExtraItems?.toFixed(2) || 'N/A'}</div><div class="text-[9px] font-bold text-gray-500 uppercase">P/E Ratio</div></div>
                </div>

                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">52W High</h3><div class="text-2xl font-black text-emerald-500">${convert(met['52WeekHigh'] || q.h)}</div></div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">52W Low</h3><div class="text-2xl font-black text-red-500">${convert(met['52WeekLow'] || q.l)}</div></div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">Day High</h3><div class="text-2xl font-black">${convert(q.h)}</div></div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">Day Low</h3><div class="text-2xl font-black">${convert(q.l)}</div></div>
            `;
            if (results) initChart(results);
        }

        function initChart(results) {
            const ctx = document.getElementById('stockChart').getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: results.map(r => new Date(r.t).toLocaleDateString(undefined, {month:'short', day:'numeric'})),
                    datasets: [{
                        data: results.map(r => r.c * exchangeRate),
                        borderColor: '#0071e3',
                        borderWidth: 4,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: (context) => {
                            const {ctx, chartArea} = context.chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                            gradient.addColorStop(0, 'rgba(0, 113, 227, 0.2)');
                            gradient.addColorStop(1, 'rgba(0, 113, 227, 0)');
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 8 }, color: '#86868b', maxTicksLimit: 10 } },
                        y: { position: 'right', grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 10, weight: '600' }, color: '#86868b' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
