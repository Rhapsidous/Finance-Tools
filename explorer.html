<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RhapsInc. | Stock Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else { document.documentElement.classList.remove('dark'); }
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; padding-top: 70px; }
        .light body { background-color: #fbfbfd; color: #1d1d1f; }
        .dark body { background-color: #000000; color: #ffffff; }
        .apple-nav { position: fixed; top: 0; left: 0; right: 0; min-height: 50px; backdrop-filter: saturate(180%) blur(20px); z-index: 1000; display: flex; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1); padding: 0 16px; }
        .light .apple-nav { background: rgba(255, 255, 255, 0.8); }
        .dark .apple-nav { background: rgba(0, 0, 0, 0.8); border-bottom: 1px solid rgba(255,255,255,0.2); }
        .apple-card { border-radius: 24px; transition: all 0.3s ease; overflow: hidden; height: 100%; }
        .light .apple-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.05); }
        .dark .apple-card { background: #1c1c1e; border: 1px solid rgba(255,255,255,0.15); }
        .pill-btn { font-size: 10px; font-weight: 800; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .pill-btn.active { background: #0071e3; color: white; }
        .pill-btn:not(.active) { color: #86868b; }
    </style>
</head>
<body class="px-4 md:px-6 pb-12">
    <nav class="apple-nav">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <span class="text-xs md:text-sm font-bold tracking-tighter">RHAPSINC.</span>
            <div class="flex gap-8">
                <a href="index.html" class="text-[10px] font-bold uppercase opacity-60 hover:opacity-100 transition">Home</a>
                <a href="networth.html" class="text-[10px] font-bold uppercase opacity-60 hover:opacity-100 transition">Projector</a>
                <a href="#" class="text-[10px] font-bold uppercase text-blue-500">Explorer</a>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex bg-gray-100 dark:bg-zinc-800 p-1 rounded-lg">
                    <span id="curGBP" onclick="setCurrency('GBP')" class="pill-btn">£</span>
                    <span id="curUSD" onclick="setCurrency('USD')" class="pill-btn active">$</span>
                </div>
                <button onclick="toggleTheme()" id="themeIcon" class="p-2">🌙</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto space-y-4 pt-6">
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Market Intelligence.</h1>
                <p class="text-gray-500 font-medium text-sm">Interactive analytical terminal.</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="stockInput" placeholder="Ticker..." class="rounded-xl px-4 py-2 w-32 md:w-48 font-bold uppercase border-none bg-gray-100 dark:bg-zinc-800 focus:ring-2 focus:ring-blue-500 text-sm">
                <button onclick="searchStock()" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-xl hover:bg-blue-500 transition-all text-sm">Search</button>
            </div>
        </header>
        <div id="resultsArea" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-stretch">
            <div class="col-span-full apple-card p-16 text-center opacity-50"><p class="text-xs font-bold uppercase tracking-widest">Awaiting Ticker Input...</p></div>
        </div>
    </main>

    <script>
        const API_KEY = 'd6d2ishr01qgk7mkb5c0d6d2ishr01qgk7mkb5cg';
        let priceChart, currentCurrency = 'USD', exchangeRate = 1, lastStockData = null;

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
            if (lastStockData) renderUI(lastStockData);
        }

        async function setCurrency(ccy) {
            currentCurrency = ccy;
            document.getElementById('curUSD').classList.toggle('active', ccy === 'USD');
            document.getElementById('curGBP').classList.toggle('active', ccy === 'GBP');
            if (ccy === 'GBP') {
                const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=FX:USDGBP&token=${API_KEY}`);
                const data = await res.json();
                exchangeRate = data.c || 0.79;
            } else { exchangeRate = 1; }
            if (lastStockData) renderUI(lastStockData);
        }

        const convert = (val) => {
            const sym = currentCurrency === 'USD' ? '$' : '£';
            return `${sym}${(val * exchangeRate).toFixed(2)}`;
        };

        async function searchStock() {
            const ticker = document.getElementById('stockInput').value.toUpperCase();
            if(!ticker) return;
            document.getElementById('resultsArea').innerHTML = `<div class="col-span-full p-16 text-center text-blue-500 font-black text-xs animate-pulse uppercase tracking-widest">Streaming Terminal Data...</div>`;
            try {
                const [q, p, m] = await Promise.all([
                    fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${API_KEY}`).then(r => r.json()),
                    fetch(`https://finnhub.io/api/v1/stock/profile2?symbol=${ticker}&token=${API_KEY}`).then(r => r.json()),
                    fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${API_KEY}`).then(r => r.json())
                ]);
                lastStockData = { q, p, m, ticker };
                renderUI(lastStockData);
            } catch (e) {
                document.getElementById('resultsArea').innerHTML = `<div class="col-span-full p-16 text-center text-red-500 font-bold uppercase text-xs">Error Loading Asset.</div>`;
            }
        }

        function renderUI(data) {
            const { q, p, m, ticker } = data;
            const met = m.metric;
            const isMonthly = ['O', 'MAIN', 'STAG', 'ADC', 'EPR', 'AGNC', 'PSEC'].includes(ticker);
            document.getElementById('resultsArea').innerHTML = `
                <div class="col-span-full apple-card p-6 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <img src="${p.logo}" class="w-12 h-12 rounded-xl bg-white p-1" onerror="this.style.display='none'">
                        <div><h2 class="text-3xl font-black tracking-tighter leading-none">${p.name || ticker}</h2><p class="text-blue-500 font-bold uppercase text-[9px] mt-1">${p.finnhubIndustry || 'Market'}</p></div>
                    </div>
                    <div class="text-right"><div class="text-3xl font-black">${convert(q.c)}</div><div class="${q.dp >= 0 ? 'text-emerald-500' : 'text-red-500'} text-xs font-bold">${q.dp >= 0 ? '▲' : '▼'} ${q.dp.toFixed(2)}%</div></div>
                </div>
                <div class="md:col-span-2 apple-card p-6">
                    <h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-4">Today's Session</h3>
                    <div class="h-[200px] w-full"><canvas id="stockChart"></canvas></div>
                </div>
                <div class="apple-card p-6 bg-blue-600 text-white flex flex-col justify-center">
                    <h3 class="text-[9px] font-black text-blue-200 uppercase tracking-widest mb-2">Dividend Yield</h3>
                    <div class="text-4xl font-black">${met.dividendYieldIndicatedAnnual?.toFixed(2) || '0.00'}%</div>
                    <p class="text-[10px] opacity-80 mt-1 font-bold uppercase">${convert(met.dividendPerShareAnnual || 0)} / Share</p>
                    <div class="mt-4 pt-4 border-t border-white/20 text-[8px] font-bold uppercase">${met.dividendPerShareAnnual > 0 ? (isMonthly ? 'Monthly Payout' : 'Quarterly Payout') : 'No Payout'}</div>
                </div>
                <div class="apple-card p-6 space-y-4">
                    <h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Valuation</h3>
                    <div><div class="text-xl font-black">${(p.marketCapitalization / 1000).toFixed(2)}B</div><div class="text-[9px] font-bold text-gray-500 uppercase">Market Cap</div></div>
                    <div><div class="text-xl font-black">${met.peBasicExclExtraItems?.toFixed(2) || 'N/A'}</div><div class="text-[9px] font-bold text-gray-500 uppercase">P/E Ratio</div></div>
                </div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">52-Week High</h3><div class="text-2xl font-black text-emerald-500">${convert(met['52WeekHigh'] || 0)}</div></div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">52-Week Low</h3><div class="text-2xl font-black text-red-500">${convert(met['52WeekLow'] || 0)}</div></div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">EPS (TTM)</h3><div class="text-2xl font-black">${convert(met.epsExclExtraItemsTTM || 0)}</div></div>
                <div class="apple-card p-6"><h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">Avg Volume</h3><div class="text-2xl font-black">${(met.paveVol10 / 1000000).toFixed(1)}M</div></div>
            `;
            initChart(q);
        }

        function initChart(q) {
            const ctx = document.getElementById('stockChart').getContext('2d');
            if (priceChart) priceChart.destroy();
            const isDark = document.documentElement.classList.contains('dark');
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Close', 'Open', 'Low', 'High', 'Live'],
                    datasets: [{
                        data: [q.pc, q.o, q.l, q.h, q.c].map(v => v * exchangeRate),
                        borderColor: '#0071e3', borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#fff', tension: 0.3, fill: true,
                        backgroundColor: isDark ? 'rgba(0, 113, 227, 0.1)' : 'rgba(0, 113, 227, 0.03)'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#86868b' } },
                        y: { position: 'right', grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 10 }, color: '#86868b' } }
                    }
                }
            });
        }
    </script>

        <footer class="max-w-7xl mx-auto px-6 py-12 mt-auto">
    <div class="border-t border-gray-100 dark:border-zinc-800 pt-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-[11px] font-bold uppercase tracking-widest opacity-40">
            © 2026 RhapsInc.
        </div>
    </div>
</footer>
</body>
</html>
