<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RhapsInc. | Stock Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class' };
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; padding-top: 80px; }
        .light body { background-color: #fbfbfd; color: #1d1d1f; }
        .dark body { background-color: #000000; color: #ffffff; }
        
        .apple-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            backdrop-filter: saturate(180%) blur(20px); z-index: 1000;
            display: flex; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .light .apple-nav { background: rgba(255, 255, 255, 0.8); }
        .dark .apple-nav { background: rgba(0, 0, 0, 0.8); border-bottom: 1px solid rgba(255,255,255,0.2); }

        .apple-card { border-radius: 28px; transition: all 0.3s ease; }
        .light .apple-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.05); }
        .dark .apple-card { background: #1c1c1e; border: 1px solid rgba(255,255,255,0.15); }
        
        input { transition: all 0.2s ease; outline: none; }
        .light input { background-color: #f2f2f7; color: #000; border: 1px solid transparent; }
        .dark input { background-color: #2c2c2e; color: #ffffff; border: 1px solid rgba(255,255,255,0.2); }
        input:focus { border-color: #0071e3 !important; }

        .pill-btn { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
        .pill-btn.active { background: #0071e3; color: white; }
    </style>
</head>
<body class="px-6 pb-12">
    <nav class="apple-nav">
        <div class="max-w-7xl mx-auto w-full px-6 flex justify-between items-center">
            <span class="text-sm font-bold tracking-tighter">RHAPSINC.</span>
            <div class="flex gap-8">
                <a href="index.html" class="text-[11px] font-bold uppercase opacity-60">Home</a>
                <a href="networth.html" class="text-[11px] font-bold uppercase opacity-60">Networth Projector</a>
                <a href="explorer.html" class="text-[11px] font-bold uppercase text-blue-500">Stock Explorer</a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex bg-gray-100 dark:bg-zinc-800 p-1 rounded-lg">
                    <span id="curGBP" class="pill-btn active">£</span>
                    <span id="curUSD" class="pill-btn">$</span>
                </div>
                <button onclick="toggleTheme()" id="themeIcon">🌙</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto space-y-8 pt-10">
        <header>
            <h1 class="text-4xl font-extrabold tracking-tight">Stock Explorer.</h1>
            <p class="text-gray-500 font-medium text-lg">Real-time asset analysis and dividend tracking.</p>
        </header>

        <div class="apple-card p-6 flex gap-4">
            <input type="text" id="stockInput" placeholder="Ticker Symbol (e.g. AAPL)..." class="flex-grow rounded-2xl p-4 text-xl font-bold uppercase">
            <button onclick="searchStock()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-10 rounded-2xl transition-all">Analyze</button>
        </div>

        <div id="resultsArea" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-12 apple-card p-20 text-center">
                <p id="statusText" class="text-gray-400 font-bold uppercase text-xs tracking-widest">Awaiting Ticker Input...</p>
             </div>
        </div>
    </main>

    <script>
        const FINNHUB_KEY = 'd6d2ishr01qgk7mkb5c0d6d2ishr01qgk7mkb5cg';
        let priceChart;

        function initTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
            if(priceChart) renderChart(priceChart.data.labels, priceChart.data.datasets[0].data);
        }

        async function searchStock() {
            const ticker = document.getElementById('stockInput').value.toUpperCase();
            const resultsArea = document.getElementById('resultsArea');
            if(!ticker) return;

            resultsArea.innerHTML = `<div class="lg:col-span-12 apple-card p-10 text-center text-blue-500 font-bold">QUERYING DATA LAKES...</div>`;

            try {
                // Fetch Price & Basic Quotes
                const quoteRes = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`);
                const qData = await quoteRes.json();

                // Fetch Dividends & Advanced Metrics
                const metricRes = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${FINNHUB_KEY}`);
                const mData = await metricRes.json();

                if (qData.c && qData.c !== 0) {
                    const price = qData.c;
                    const changePercent = qData.dp;
                    const divYield = mData.metric?.dividendYieldIndicatedAnnual || 0;
                    const divPerShare = mData.metric?.dividendPerShareAnnual || 0;

                    resultsArea.innerHTML = `
                        <div class="lg:col-span-12 apple-card p-10 flex justify-between items-center">
                            <div>
                                <h2 class="text-6xl font-black tracking-tighter">${ticker}</h2>
                                <p class="text-gray-500 font-bold uppercase tracking-widest text-xs mt-2">Live Market Valuation</p>
                            </div>
                            <div class="text-right">
                                <div class="text-6xl font-extrabold tracking-tight">${price.toFixed(2)}</div>
                                <div class="${changePercent >= 0 ? 'text-emerald-500' : 'text-red-500'} font-black text-xl mt-1">
                                    ${changePercent >= 0 ? '▲' : '▼'} ${changePercent.toFixed(2)}%
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-8 apple-card p-10">
                            <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6 text-center">Price Action (24H Volatility)</h3>
                            <div class="h-[300px] w-full">
                                <canvas id="tickerChart"></canvas>
                            </div>
                        </div>

                        <div class="lg:col-span-4 apple-card p-8 flex flex-col justify-between">
                            <div>
                                <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6">Dividend Terminal</h3>
                                <div class="space-y-6">
                                    <div>
                                        <div class="text-4xl font-black text-blue-500">${divYield.toFixed(2)}%</div>
                                        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-tight">Indicative Yield</div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="bg-gray-50 dark:bg-white/5 p-4 rounded-2xl">
                                            <div class="text-lg font-bold">£${divPerShare.toFixed(2)}</div>
                                            <div class="text-[9px] font-black text-gray-500 uppercase">Annual Payout</div>
                                        </div>
                                        <div class="bg-gray-50 dark:bg-white/5 p-4 rounded-2xl">
                                            <div class="text-lg font-bold">${divPerShare > 0 ? 'Quarterly' : 'N/A'}</div>
                                            <div class="text-[9px] font-black text-gray-500 uppercase">Frequency</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="pt-6 border-t border-gray-100 dark:border-white/10 mt-6">
                                <p class="text-[10px] text-gray-400 leading-relaxed font-medium italic text-center">
                                    "Dividends are the heartbeat of long-term compounding."
                                </p>
                            </div>
                        </div>
                    `;

                    // Generate pseudo-historical data for the graph using the quote high/low/open
                    const labels = ['Open', 'Low', 'High', 'Current'];
                    const prices = [qData.o, qData.l, qData.h, qData.c];
                    renderChart(labels, prices);

                } else {
                    resultsArea.innerHTML = `<div class="lg:col-span-12 apple-card p-10 text-center text-red-500 font-bold uppercase tracking-widest">Symbol Mismatch or Invalid API Route.</div>`;
                }
            } catch (error) {
                resultsArea.innerHTML = `<div class="lg:col-span-12 apple-card p-10 text-center text-red-500 font-bold uppercase tracking-widest">Telemetry Lost: Connection Error.</div>`;
            }
        }

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('tickerChart').getContext('2d');
            if(priceChart) priceChart.destroy();
            
            const isDark = document.documentElement.classList.contains('dark');
            
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#0071e3',
                        borderWidth: 4,
                        pointRadius: 6,
                        pointBackgroundColor: '#0071e3',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: isDark ? 'rgba(0, 113, 227, 0.1)' : 'rgba(0, 113, 227, 0.03)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: true, grid: { display: false }, ticks: { color: '#86868b', font: { weight: 'bold' } } },
                        y: { display: true, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }, ticks: { color: '#86868b' } }
                    }
                }
            });
        }

        initTheme();
    </script>
</body>
</html>
