<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RhapsInc. | Wealth Projector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; padding-top: 80px; }
        .light body { background-color: #fbfbfd; color: #1d1d1f; }
        .dark body { background-color: #000000; color: #ffffff; }
        
        .apple-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            backdrop-filter: saturate(180%) blur(20px); z-index: 1000;
            display: flex; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .light .apple-nav { background: rgba(255, 255, 255, 0.8); }
        .dark .apple-nav { background: rgba(0, 0, 0, 0.8); border-bottom: 1px solid rgba(255,255,255,0.2); }

        .apple-card { border-radius: 28px; transition: all 0.3s ease; }
        .light .apple-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .dark .apple-card { background: #1c1c1e; border: 1px solid rgba(255,255,255,0.15); }
        
        input { transition: all 0.2s ease; outline: none; }
        .light input { background-color: #f2f2f7; color: #000; border: 1px solid transparent; }
        .dark input { background-color: #2c2c2e; color: #ffffff; border: 1px solid rgba(255,255,255,0.2); }
        input:focus { border-color: #0071e3 !important; }

        .metric-label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: #86868b; margin-bottom: 4px; }
        .metric-value { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.05em; }

        .pill-btn { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
        .pill-btn.active { background: #0071e3; color: white; }
        .pill-btn:not(.active) { color: #86868b; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #48484a; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="px-6 pb-12">

    <nav class="apple-nav">
        <div class="max-w-7xl mx-auto w-full px-6 flex justify-between items-center">
            <span class="text-sm font-bold tracking-tighter">RHAPSINC.</span>
            <div class="flex gap-8">
                <a href="index.html" class="text-[11px] font-bold uppercase opacity-60">Home</a>
                <a href="networth.html" class="text-[11px] font-bold uppercase text-blue-500">Networth Projector</a>
                <a href="explorer.html" class="text-[11px] font-bold uppercase opacity-60 hover:opacity-100">Stock Explorer</a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex bg-gray-100 dark:bg-zinc-800 p-1 rounded-lg">
                    <span id="curGBP" class="pill-btn active" onclick="setCurrency('GBP')">£</span>
                    <span id="curUSD" class="pill-btn" onclick="setCurrency('USD')">$</span>
                </div>
                <button onclick="toggleTheme()" id="themeIcon">🌙</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto space-y-12">
        <header class="pt-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2">Wealth Projector.</h1>
            <p class="text-gray-500 font-medium">Precision wealth modeling for the long term.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="apple-card p-8 space-y-6">
                    <div>
                        <label class="metric-label">Initial Portfolio (<span class="currencyLabel">£</span>)</label>
                        <input type="number" id="initBalance" value="10000" oninput="updateProjection()" class="w-full rounded-2xl p-4 text-xl font-bold">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="metric-label">Savings (<span class="currencyLabel">£</span>)</label>
                            <div class="flex bg-gray-100 dark:bg-black p-1 rounded-lg">
                                <span id="btnMonthly" class="pill-btn active" onclick="setFreq('monthly')">Monthly</span>
                                <span id="btnYearly" class="pill-btn" onclick="setFreq('yearly')">Yearly</span>
                            </div>
                        </div>
                        <input type="number" id="savingsAmount" value="1000" oninput="updateProjection()" class="w-full rounded-2xl p-4 text-xl font-bold">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="metric-label">Stock Growth %</label>
                            <input type="number" id="growthRate" value="7" oninput="updateProjection()" class="w-full rounded-2xl p-4 text-xl font-bold">
                        </div>
                        <div>
                            <label class="metric-label">Div Yield %</label>
                            <input type="number" id="divYield" value="3" oninput="updateProjection()" class="w-full rounded-2xl p-4 text-xl font-bold">
                        </div>
                    </div>
                    <div>
                        <label class="metric-label">Years of Growth</label>
                        <input type="number" id="years" value="25" oninput="updateProjection()" class="w-full rounded-2xl p-4 text-xl font-bold">
                    </div>
                    
                    <div class="flex items-center justify-between p-4 bg-gray-100 dark:bg-white/5 rounded-2xl">
                        <div>
                            <div class="font-bold text-sm">DRIP</div>
                            <div class="text-[10px] text-gray-500 font-bold uppercase">Reinvest Dividends</div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="dripToggle" checked onchange="updateProjection()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="apple-card p-10">
                    <div class="flex justify-between items-start mb-10">
                        <div>
                            <div class="metric-label">Projected Total Wealth</div>
                            <div id="finalValue" class="metric-value text-blue-500">£0</div>
                        </div>
                        <div class="text-right">
                            <div class="metric-label">Total Dividends Paid</div>
                            <div id="totalDivs" class="text-2xl font-bold text-emerald-500">£0</div>
                        </div>
                    </div>
                    <div class="h-[400px]">
                        <canvas id="projectionChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-20 text-center">
        <p class="text-[11px] text-gray-400 font-bold uppercase tracking-[0.3em]">© 2026 RhapsInc. Terminal</p>
    </footer>

    <script>
        let chart;
        let frequency = 'monthly';
        let currencySymbol = '£';

        function setCurrency(c) {
            currencySymbol = (c === 'GBP') ? '£' : '$';
            document.getElementById('curGBP').classList.toggle('active', c === 'GBP');
            document.getElementById('curUSD').classList.toggle('active', c === 'USD');
            
            // Update all small labels in the inputs
            document.querySelectorAll('.currencyLabel').forEach(el => el.innerText = currencySymbol);
            
            updateProjection();
        }

        function setFreq(f) {
            frequency = f;
            document.getElementById('btnMonthly').classList.toggle('active', f === 'monthly');
            document.getElementById('btnYearly').classList.toggle('active', f === 'yearly');
            updateProjection();
        }

        function updateProjection() {
            const init = parseFloat(document.getElementById('initBalance').value) || 0;
            const savingsInput = parseFloat(document.getElementById('savingsAmount').value) || 0;
            const growthRate = (parseFloat(document.getElementById('growthRate').value) || 0) / 100 / 12;
            const divYield = (parseFloat(document.getElementById('divYield').value) || 0) / 100 / 12;
            const years = parseInt(document.getElementById('years').value) || 0;
            const isDRIP = document.getElementById('dripToggle').checked;

            const monthlyContribution = frequency === 'monthly' ? savingsInput : savingsInput / 12;

            let balance = init;
            let totalDivsAccumulated = 0;
            const labels = [];
            const data = [];

            for (let m = 0; m <= years * 12; m++) {
                if (m % 12 === 0) {
                    labels.push('Yr ' + (m / 12));
                    data.push(Math.round(balance));
                }
                if (m === years * 12) break;

                let monthlyGrowthVal = balance * growthRate;
                let monthlyDivVal = balance * divYield;
                totalDivsAccumulated += monthlyDivVal;
                
                balance += monthlyGrowthVal;
                balance += monthlyContribution;
                if(isDRIP) balance += monthlyDivVal;
            }

            document.getElementById('finalValue').innerText = currencySymbol + Math.round(balance).toLocaleString();
            document.getElementById('totalDivs').innerText = currencySymbol + Math.round(totalDivsAccumulated).toLocaleString();
            renderChart(labels, data);
        }

        function renderChart(labels, data) {
            const ctx = document.getElementById('projectionChart').getContext('2d');
            if (chart) chart.destroy();
            const isDark = document.documentElement.classList.contains('dark');
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        borderColor: '#0071e3',
                        borderWidth: 4,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: isDark ? 'rgba(0, 113, 227, 0.2)' : 'rgba(0, 113, 227, 0.05)'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return currencySymbol + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#86868b' } },
                        y: { position: 'right', grid: { color: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.05)' }, ticks: { color: '#86868b' } }
                    }
                }
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            document.getElementById('themeIcon').innerText = html.classList.contains('dark') ? '☀️' : '🌙';
            updateProjection();
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').innerText = '☀️';
        }
        updateProjection();
    </script>
</body>
</html>
