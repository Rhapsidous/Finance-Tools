<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RhapsInc. | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.add(theme);
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; padding-top: 80px; transition: background-color 0.3s ease; }
        .dark body { background-color: #000000; color: #ffffff; }
        .light body { background-color: #f5f5f7; color: #1d1d1f; }
        .apple-nav { position: fixed; top: 0; left: 0; right: 0; height: 52px; backdrop-filter: saturate(180%) blur(20px); z-index: 1000; border-bottom: 1px solid rgba(128,128,128,0.1); display: flex; align-items: center; }
        .dark .apple-nav { background: rgba(0, 0, 0, 0.75); }
        .light .apple-nav { background: rgba(255, 255, 255, 0.8); }
        .pill-btn { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .pill-btn.active { background: #0071e3; color: white; }
        .dark .pill-btn:not(.active) { color: #636366; }
        .light .pill-btn:not(.active) { color: #8e8e93; }
        .hero-gradient { background: linear-gradient(180deg, #0071e3 0%, #002e5d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Pulse Animation */
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }
    </style>
</head>
<body class="px-6">
    <nav class="apple-nav">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center px-4">
            <span class="text-xs font-black tracking-tighter text-blue-500">RHAPSINC.</span>
            <div class="flex gap-6 md:gap-10">
                <a href="index.html" class="text-[10px] font-bold uppercase text-blue-500">Home</a>
                <a href="explorer.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Explorer</a>
                <a href="networth.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Projector</a>
                <a href="ledger.html" class="text-[10px] font-bold uppercase opacity-50 hover:opacity-100 transition">Dividends</a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex bg-gray-500/10 p-1 rounded-lg">
                    <span id="curGBP" onclick="setCurrency('GBP')" class="pill-btn">£</span>
                    <span id="curUSD" onclick="setCurrency('USD')" class="pill-btn active">$</span>
                </div>
                <button onclick="toggleTheme()" class="text-lg hover:scale-110 transition">🌓</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-16 text-center space-y-8">
        <div class="inline-flex items-center gap-2 bg-gray-500/5 px-4 py-2 rounded-full border border-gray-500/10">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500 pulse"></span>
            <span id="statusText" class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">Checking API Link...</span>
        </div>

        <h1 class="text-7xl font-black tracking-tighter hero-gradient">Wealth, Projected.</h1>
        <p class="text-xl text-gray-500 font-medium max-w-2xl mx-auto leading-relaxed">A private, high-performance ecosystem for the modern investor. Real-time data, future projections, and income tracking in one unified interface.</p>
        
        <div class="flex flex-col md:flex-row justify-center gap-4 pt-8">
            <a href="explorer.html" class="bg-blue-600 text-white font-bold px-10 py-4 rounded-2xl hover:bg-blue-500 transition-all active:scale-95 shadow-lg shadow-blue-500/20">Market Explorer</a>
            <a href="networth.html" class="bg-gray-500/10 font-bold px-10 py-4 rounded-2xl hover:bg-gray-500/20 transition-all active:scale-95">Growth Projector</a>
            <a href="ledger.html" class="bg-gray-500/10 font-bold px-10 py-4 rounded-2xl hover:bg-gray-500/20 transition-all active:scale-95">Income Dividends</a>
        </div>
    </main>

    <script>
        const FINNHUB_KEY = 'd6d2ishr01qgk7mkb5c0d6d2ishr01qgk7mkb5cg';

        async function checkAPIStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            try {
                // Testing connection with a simple quote fetch for AAPL
                const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=AAPL&token=${FINNHUB_KEY}`);
                if (response.ok) {
                    dot.classList.remove('bg-yellow-500', 'pulse');
                    dot.classList.add('bg-emerald-500');
                    text.innerText = "System Status: Online";
                    text.classList.remove('text-gray-500');
                    text.classList.add('text-emerald-500');
                } else {
                    throw new Error();
                }
            } catch (e) {
                dot.classList.remove('pulse');
                dot.classList.add('bg-red-500');
                text.innerText = "System Status: Connection Error";
                text.classList.add('text-red-500');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
            html.classList.remove('dark', 'light');
            html.classList.add(newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function setCurrency(ccy) {
            document.getElementById('curUSD').classList.toggle('active', ccy === 'USD');
            document.getElementById('curGBP').classList.toggle('active', ccy === 'GBP');
            localStorage.setItem('currency', ccy);
        }

        window.onload = checkAPIStatus;
    </script>
</body>
</html>
